<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard - JobVoice</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-row .input-field { flex: 1; }
        .star { font-size: 30px; background: none; border: none; cursor: pointer; color: #ddd; }
        .star.selected { color: gold; }
        .accept-btn { background: #27ae60; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        .reject-btn { background: #e74c3c; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; }
        .job-card { background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-left: 4px solid #667eea; }
        .job-title { font-size: 18px; font-weight: bold; }
        .job-wage { color: #27ae60; font-weight: bold; margin: 8px 0; }
        .loading { text-align: center; padding: 20px; color: #667eea; }
        .message { padding: 10px; margin: 10px 0; border-radius: 5px; text-align: center; }
        .success { background: #d4edda; color: green; }
        .error { background: #f8d7da; color: red; }
        .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat { flex: 1; background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 15px; text-align: center; border-radius: 10px; }
        .stat-value { font-size: 28px; font-weight: bold; display: block; }
        .tabs { display: flex; gap: 5px; margin: 20px 0; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 10px; background: #f0f0f0; border: none; border-radius: 10px; cursor: pointer; }
        .tab-btn.active { background: #667eea; color: white; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .search-container { background: #f8f9fa; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 8px; }
        .btn-primary { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <div class="logo-small">🎤 JobVoice</div>
            <div class="user-info">
                <span class="user-name" id="companyName">Employer</span>
                <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-value" id="jobsPosted">0</span>
                <span class="stat-label">Jobs Posted</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="workersHired">0</span>
                <span class="stat-label">Workers Hired</span>
            </div>
        </div>

        <div class="search-container">
            <h3>📢 Post a New Job</h3>
            <input type="text" id="jobTitle" placeholder="Job Title *" class="input-field">
            <textarea id="jobDesc" placeholder="Job Description" rows="2" class="input-field"></textarea>
            <input type="text" id="jobSkills" placeholder="Skills Required" class="input-field">
            
            <div class="form-row">
                <input type="number" id="jobWage" placeholder="Wage Amount *" class="input-field">
                <select id="wageType" class="input-field">
                    <option value="daily">Per Day</option>
                    <option value="hourly">Per Hour</option>
                    <option value="weekly">Per Week</option>
                </select>
            </div>
            
            <input type="text" id="jobAddress" placeholder="Work Location" class="input-field">
            
            <h4 style="margin-top: 15px;">📞 Contact Person Details</h4>
            <div class="form-row">
                <input type="text" id="contactPerson" placeholder="Contact Person Name *" class="input-field">
                <input type="tel" id="contactPhone" placeholder="Contact Phone Number *" class="input-field">
            </div>
            
            <button id="postJobBtn" class="btn-primary">📢 POST JOB</button>
            <div id="postMessage" style="margin-top: 10px;"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="myjobs">📋 My Jobs</button>
            <button class="tab-btn" data-tab="applications">📝 Applications</button>
            <button class="tab-btn" data-tab="hired">✅ Hired Workers</button>
            <button class="tab-btn" data-tab="rate">⭐ Rate Workers</button>
        </div>

        <div id="myjobsTab" class="tab-content active">
            <div id="myJobs" class="job-list">Loading...</div>
        </div>
        <div id="applicationsTab" class="tab-content">
            <div id="applicationsList" class="job-list">Loading...</div>
        </div>
        <div id="hiredTab" class="tab-content">
            <div id="hiredList" class="job-list">Loading...</div>
        </div>
        <div id="rateTab" class="tab-content">
            <div id="rateList" class="job-list">Loading...</div>
        </div>

        <div id="message"></div>
    </div>

    <script src="js/employer.js"></script>
</body>
</html>
